name: mongoo-life

services:
  mysql:
    image: mysql:8.0
    container_name: mongoo-life-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mongoo_life
      MYSQL_USER: mongoo
      MYSQL_PASSWORD: mongoo_password
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - .docker/mysql/initdb.d:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    ports:
      - "33066:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - mongoo-life

networks:
  mongoo-life:
    driver: bridge

volumes:
  mysql-data:
